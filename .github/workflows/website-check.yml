name: Website build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Emit reproducible dependency lock for review
        run: |
          echo PROJECT_PRIME_LOCK_BEGIN
          cat package-lock.json
          echo PROJECT_PRIME_LOCK_END
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Map API contract tests
        run: npm run test:maps
      - name: Build site
        run: npm run build
