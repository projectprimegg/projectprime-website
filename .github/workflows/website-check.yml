name: Website build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Map API contract tests
        run: npm run test:maps
      - name: Hunter License contract tests
        run: npm run test:license
      - name: Public Hunter leaderboard contracts
        run: npm run test:leaderboards
      - name: Direct PK3 publishing contracts
        run: npm run test:pk3
      - name: Build site
        run: npm run build
