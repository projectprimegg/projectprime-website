name: AI Map Engineer Phase 3 Windows client

on:
  push:
    branches:
      - ums-ai-engineer-phase3
    paths:
      - ".github/workflows/ai-map-engineer-phase3.yml"
      - "build-staging/ai-engineer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout AI Engineer staging
        uses: actions/checkout@v4

      - name: Checkout validated Universal Map Studio Phase 2 patch
        uses: actions/checkout@v4
        with:
          repository: projectprimegg/projectprime-website
          ref: ci/universal-map-studio-v20
          path: phase2-staging

      - name: Checkout Project Prime 0.1.53
        uses: actions/checkout@v4
        with:
          repository: AntiNotAnti/Project-Prime
          ref: 91b1c0c6c44e8c90effd250729709f791a84765e
          path: prime

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Decode validated Universal Map Studio patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $encoded = "phase2-staging/build-staging/universal-phase2-valid.patch.xz.b64"
          [IO.File]::WriteAllBytes("universal-phase2-valid.patch.xz", [Convert]::FromBase64String((Get-Content $encoded -Raw).Trim()))
          7z x -y "universal-phase2-valid.patch.xz" -o"." | Out-Null

      - name: Apply Universal Map Studio Phase 2
        shell: bash
        working-directory: prime
        run: |
          set -euxo pipefail
          git apply --whitespace=nowarn ../universal-phase2-valid.patch

      - name: Integrate AI Map Engineer Phase 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python build-staging/ai-engineer/apply_ai_engineer.py build-staging/ai-engineer prime

      - name: Verify source delta
        shell: bash
        working-directory: prime
        run: |
          set -euxo pipefail
          git diff --check
          test -f src/MphRead/Mods/MapEditor/AiMapEngineer.cs
          test -f src/MphRead/Mods/Launcher/Gui/MapStudioAiEngineer.cs
          grep -q "AI Map Engineer" src/MphRead/Mods/Launcher/Gui/MapStudioScreen.cs
          grep -q "aimapengineerhelp" src/MphRead/Mods/ModEntry.cs
          git status --short

      - name: Restore Project Prime and editor checks
        shell: pwsh
        working-directory: prime
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore src/MphRead/MphRead.csproj -r win-x64
          dotnet restore tools/map-editor-check/map-editor-check.csproj

      - name: Run Map Studio core checks
        shell: pwsh
        working-directory: prime
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run --project tools/map-editor-check/map-editor-check.csproj -c Release --no-restore

      - name: Publish Windows x64 client
        shell: pwsh
        working-directory: prime
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src/MphRead/MphRead.csproj -c Release -r win-x64 --self-contained true --no-restore -o ../publish

      - name: Verify headless AI tool contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./publish/ProjectPrime.exe" -aimapengineerhelp | Tee-Object -FilePath "publish/AI_MAP_ENGINEER_TOOLS.json"
          if ($LASTEXITCODE -ne 0) { throw "AI Map Engineer help command failed with exit code $LASTEXITCODE" }
          $tools = Get-Content "publish/AI_MAP_ENGINEER_TOOLS.json" -Raw
          foreach ($required in @("inspect_map", "validate_map", "compile_map", "run_map_audit", "create_checkpoint", "restore_checkpoint")) {
            if (-not $tools.Contains($required)) { throw "Missing AI tool: $required" }
          }

      - name: Write build provenance and test guide
        shell: pwsh
        run: |
          @"
          Project Prime Universal AI Map Engineer Phase 3

          Base:
          - AntiNotAnti/Project-Prime v0.1.53
          - commit 91b1c0c6c44e8c90effd250729709f791a84765e
          - validated Universal Map Studio Phase 2 patch

          Added in this build:
          - In-client AI MAP ENGINEER panel in Map Studio
          - Structured, model-agnostic tool API
          - Read-only inspection, validation, compilation and runtime-audit tools
          - Reversible selection/map edits through normal MapDocument history
          - Automatic checkpoints before significant mutating tools
          - Named checkpoint creation/restoration
          - Headless -aimapengineer and -aimapengineerhelp command path
          - JSON results suitable for an external PP-Agent process

          First test:
          1. Run Start_ProjectPrime.cmd.
          2. Open Map Studio.
          3. Open or create a project.
          4. Choose Build > AI Map Engineer, or click AI ENGINEER.
          5. Run INSPECT MAP, VALIDATE and CHECKPOINT.
          6. Use RUN JSON for controlled tool requests.

          This remains an engineering client. Direct cloud-model authentication and the later autonomous repair loop are intentionally not hardcoded into ProjectPrime.exe.
          "@ | Set-Content -Encoding UTF8 publish/AI_MAP_ENGINEER_PHASE3_README.txt
          @"
          @echo off
          setlocal
          cd /d "%~dp0"
          ProjectPrime.exe -launcher -noupdate -userdata "%cd%\UserData"
          "@ | Set-Content -Encoding ASCII publish/Start_ProjectPrime.cmd

      - name: Upload Windows test client
        uses: actions/upload-artifact@v4
        with:
          name: ProjectPrime-Universal-AI-Map-Engineer-Phase3
          path: publish/**
          if-no-files-found: error
          retention-days: 30
