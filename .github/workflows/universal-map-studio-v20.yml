name: Universal Map Studio Windows test

on:
  push:
    branches:
      - ci/universal-map-studio-v20
    paths:
      - ".github/workflows/universal-map-studio-v20.yml"
      - "build-staging/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build staging
        uses: actions/checkout@v4

      - name: Checkout Project Prime 0.1.53
        uses: actions/checkout@v4
        with:
          repository: AntiNotAnti/Project-Prime
          ref: 91b1c0c6c44e8c90effd250729709f791a84765e
          path: prime

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Decode validated Universal Map Studio patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [IO.File]::WriteAllBytes("universal-phase2-valid.patch.xz", [Convert]::FromBase64String((Get-Content "build-staging/universal-phase2-valid.patch.xz.b64" -Raw).Trim()))
          7z x -y "universal-phase2-valid.patch.xz" -o"." | Out-Null

      - name: Apply Universal Map Studio patch
        shell: bash
        working-directory: prime
        run: |
          set -euxo pipefail
          git apply --whitespace=nowarn ../universal-phase2-valid.patch
          git diff --check
          git status --short

      - name: Restore
        shell: pwsh
        working-directory: prime
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore src/MphRead/MphRead.csproj -r win-x64

      - name: Publish Windows x64 test client
        shell: pwsh
        working-directory: prime
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src/MphRead/MphRead.csproj -c Release -r win-x64 --self-contained true -o ../publish

      - name: Write provenance
        shell: pwsh
        run: |
          @"
          Universal AI Map Studio engineering test client
          Base: AntiNotAnti/Project-Prime v0.1.53 commit 91b1c0c6c44e8c90effd250729709f791a84765e
          Added: Universal Map Studio Phase 2 integration
          Target: win-x64 self-contained, .NET SDK 10.0.401
          Purpose: runtime test of UniversalMap import/validation/UI path.
          This first CI binary does not yet include the separate custom v19/v20 HUD/audio/font asset reconstruction.
          "@ | Set-Content -Encoding UTF8 publish/UNIVERSAL_MAP_STUDIO_TEST_BUILD.txt

      - name: Upload Windows test client
        uses: actions/upload-artifact@v4
        with:
          name: ProjectPrime-Universal-Map-Studio-Test
          path: publish/**
          if-no-files-found: error
          retention-days: 30
